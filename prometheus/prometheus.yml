# Intervalos curtos facilitam visualizar mudanças durante a demonstração do desafio.
global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

# O primeiro job monitora o próprio Prometheus para diagnosticar o coletor.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # O segundo job coleta /metrics pelo nome interno do serviço Go na rede bridge.
  - job_name: http-server-projeto-korp
    metrics_path: /metrics
    static_configs:
      - targets:
          - http-server-projeto-korp:8080
