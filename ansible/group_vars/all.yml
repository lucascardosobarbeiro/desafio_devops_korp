# Diretório remoto que concentrará todos os artefatos usados pelo Docker Compose.
project_deploy_dir: /opt/http-server-projeto-korp

# Nome, tag e rede são centralizados para manter Ansible e Compose consistentes.
app_image_name: http-server-projeto-korp
app_image_tag: "1.0.0"
docker_network_name: projeto-korp-network

# Portas publicadas no host Linux.
nginx_port: 80
prometheus_port: 9090
grafana_port: 3000

# O usuário pode ser versionado; a senha é gerada no nó de controle e gravada em diretório ignorado.
grafana_admin_user: admin
project_secrets_dir: "{{ playbook_dir }}/.secrets"
grafana_admin_password_file: "{{ project_secrets_dir }}/grafana_admin_password"
grafana_admin_password: >-
  {{ lookup('ansible.builtin.password', grafana_admin_password_file,
  length=32, chars=['ascii_letters', 'digits']) }}
