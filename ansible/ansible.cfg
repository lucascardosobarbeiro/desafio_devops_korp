[defaults]
# O inventário padrão permite executar o desafio em uma VM Linux local sem repetir parâmetros.
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
host_key_checking = True

[privilege_escalation]
# Todas as tarefas de sistema usam sudo de forma explícita e previsível.
become = True
become_method = sudo
