---
# O repositório Docker usa nomes de arquitetura Debian diferentes dos fatos do Ansible.
docker_architecture_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf

# A arquitetura original é mantida como fallback para plataformas já compatíveis.
docker_apt_architecture: "{{ docker_architecture_map.get(ansible_architecture, ansible_architecture) }}"
