---
# O desafio solicita Linux livremente escolhido; a automação foi delimitada a Ubuntu suportado.
- name: Validar sistema operacional gerenciado
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
      - ansible_distribution == "Ubuntu"
    fail_msg: "Este playbook suporta Ubuntu Linux; ajuste a role docker para outra distribuição."
    success_msg: "Host Ubuntu Linux compatível com o playbook."

# Pacotes conflitantes são removidos antes de instalar a distribuição oficial do Docker CE.
- name: Remover pacotes Docker conflitantes
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: false
    update_cache: true

# Dependências atendem HTTPS, gerenciamento da chave e módulos community.docker no host remoto.
- name: Instalar dependências do repositório e dos módulos Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-requests
    state: present
    update_cache: true
    cache_valid_time: 3600

# A chave fica em keyrings e é vinculada somente ao repositório Docker.
- name: Criar diretório de chaves APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Baixar chave oficial do repositório Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

# O codename vem dos fatos do Ubuntu, permitindo Noble, Jammy e versões futuras suportadas.
- name: Configurar repositório APT oficial do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

# Buildx é necessário para docker_image_build; compose-plugin atende ao Compose v2 atual.
- name: Instalar Docker Engine e plugins oficiais
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  notify: Reiniciar Docker

# Executa handlers antes das verificações para garantir que o socket já esteja disponível.
- name: Aplicar alterações pendentes no serviço Docker
  ansible.builtin.meta: flush_handlers

- name: Habilitar e iniciar Docker no boot
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

# As verificações falham cedo e mostram versões úteis durante a demonstração.
- name: Verificar Docker Engine
  ansible.builtin.command: docker version --format {% raw %}'{{.Server.Version}}'{% endraw %}
  register: docker_version_result
  changed_when: false

- name: Verificar Docker Compose v2
  ansible.builtin.command: docker compose version --short
  register: compose_version_result
  changed_when: false

- name: Exibir versões instaladas
  ansible.builtin.debug:
    msg:
      - "Docker Engine: {{ docker_version_result.stdout }}"
      - "Docker Compose: {{ compose_version_result.stdout }}"
