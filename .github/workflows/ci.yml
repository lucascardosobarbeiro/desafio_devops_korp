---
# A pipeline valida aplicação, imagens, configurações e automação a cada mudança no repositório.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Somente leitura é suficiente; nenhum job publica imagens ou altera infraestrutura externa.
permissions:
  contents: read

# Uma execução nova da mesma referência substitui a anterior para economizar tempo do runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testes com race detector e cobertura protegem o contrato HTTP e as métricas da aplicação.
  application:
    name: Go application
    runs-on: ubuntu-latest
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Executar testes e detector de corrida
        working-directory: app
        run: go test -race -coverprofile=coverage.out ./...

      - name: Exigir cobertura mínima de 50 por cento
        working-directory: app
        run: |
          go tool cover -func=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN {exit !(coverage >= 50)}'

      - name: Executar análise estática e compilação
        working-directory: app
        run: |
          go vet ./...
          go build -trimpath ./...

  # O job usa as próprias imagens fixadas pelo projeto para validar os arquivos carregados em runtime.
  containers:
    name: Containers and observability
    runs-on: ubuntu-latest
    env:
      GRAFANA_ADMIN_PASSWORD: ci-validation-only
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagem da aplicação
        run: docker build --tag http-server-projeto-korp:ci ./app

      - name: Validar configuração NGINX
        run: >-
          docker run --rm
          --add-host http-server-projeto-korp:127.0.0.1
          --volume "${PWD}/nginx/conf.d:/etc/nginx/conf.d:ro"
          nginx:1.30.4-alpine3.24 nginx -t

      - name: Validar configuração e alertas Prometheus
        run: |
          docker run --rm --entrypoint promtool \
            --volume "${PWD}/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.3 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            --volume "${PWD}/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.3 check rules /etc/prometheus/rules/alerts.yml

      - name: Validar JSON do dashboard Grafana
        run: jq --exit-status empty grafana/dashboards/http-server-projeto-korp-dashboard.json

  # O syntax-check e o lint detectam módulos obsoletos, variáveis inválidas e problemas de idempotência.
  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar ferramentas e collection
        run: |
          python -m pip install --disable-pip-version-check \
            ansible-core==2.21.4 ansible-lint==26.8.0
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validar sintaxe e boas práticas
        working-directory: ansible
        run: |
          ansible-playbook --syntax-check site.yml
          ansible-lint site.yml
