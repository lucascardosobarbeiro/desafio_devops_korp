# O upstream usa o nome do serviço no DNS interno da rede Docker, nunca um IP fixo.
upstream http_server_projeto_korp {
    server http-server-projeto-korp:8080;
    keepalive 16;
}

# Este servidor publica apenas o contrato da aplicação e seu endpoint de disponibilidade.
server {
    listen 80 default_server;
    server_name _;

    # Headers e timeouts comuns são herdados somente pelas locations que usam proxy_pass.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    location = /projeto-korp {
        proxy_pass http://http_server_projeto_korp;
    }

    # O healthcheck pode ser consultado pelo Docker sem expor detalhes internos.
    location = /healthz {
        access_log off;
        proxy_pass http://http_server_projeto_korp;
    }

    # /metrics continua acessível apenas na rede Docker para o Prometheus.
    location / {
        return 404;
    }
}
