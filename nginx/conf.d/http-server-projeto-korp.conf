# O upstream usa o nome do serviço no DNS interno da rede Docker, nunca um IP fixo.
upstream http_server_projeto_korp {
    server http-server-projeto-korp:8080;
    keepalive 16;
}

# Este servidor recebe todas as chamadas na porta 80 e preserva o caminho original.
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://http_server_projeto_korp;
        proxy_http_version 1.1;

        # Headers de proxy preservam contexto útil para logs e futuras políticas de acesso.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts evitam conexões indefinidamente presas em caso de falha do backend.
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
